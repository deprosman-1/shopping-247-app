name: Build Android APK & Publish Release

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build 24/7 SHOPPING APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare Android SDK & accept licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          mkdir -p "$SDK_DIR/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e" > "$SDK_DIR/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$SDK_DIR/licenses/android-sdk-preview-license"
          printf "\nd975f751698a77b662f1e54ddbeed3b01e93895a" > "$SDK_DIR/licenses/intel-android-extra-license"
          SDKMANAGER=$(command -v sdkmanager || find "$SDK_DIR" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses > /dev/null 2>&1 || true
          fi

      - name: Restore cached release keystore
        uses: actions/cache@v4
        with:
          path: my-upload-key.jks
          key: 247-shopping-release-keystore-v1

      - name: Prepare release keystore & env
        env:
          SECRET_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SECRET_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SECRET_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          STORE_PASS="${SECRET_STORE_PASSWORD:-DeprosMall247Release}"
          KEY_PASS="${SECRET_KEY_PASSWORD:-$STORE_PASS}"
          echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> "$GITHUB_ENV"
          echo "STORE_PASSWORD=$STORE_PASS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"
          if [ ! -s my-upload-key.jks ] || ! keytool -list -keystore my-upload-key.jks -storepass "$STORE_PASS" -alias upload >/dev/null 2>&1; then
            rm -f my-upload-key.jks
            echo "Generating release keystore my-upload-key.jks with keytool..."
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -storepass "$STORE_PASS" \
              -alias upload \
              -keypass "$KEY_PASS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=DEPROS 24/7 SMART SHOPPING MALL,O=DEPROS 24/7,L=Lagos,C=NG"
          fi
          keytool -list -keystore my-upload-key.jks -storepass "$STORE_PASS"
          : > .env
          if [ -n "$SECRET_SUPABASE_URL" ]; then
            printf "SUPABASE_URL=%s\n" "$(printf '%s' "$SECRET_SUPABASE_URL" | tr -d '\r\n')" >> .env
          fi
          if [ -n "$SECRET_SUPABASE_ANON_KEY" ]; then
            printf "SUPABASE_ANON_KEY=%s\n" "$(printf '%s' "$SECRET_SUPABASE_ANON_KEY" | tr -d '\r\n')" >> .env
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace -Dorg.gradle.workers.max=2 -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8"

      - name: Package APK for download
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/247-shopping.apk
          ls -lh dist/247-shopping.apk

      - name: Upload APK to Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 247-shopping-apk
          path: dist/247-shopping.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Releases
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v1.0-latest
          name: 24/7 SHOPPING — Latest Android APK
          body: |
            Automatically compiled Android APK for **24/7 SHOPPING**.

            ### How to download & install
            1. Click **`247-shopping.apk`** in **Assets** below to download to your phone or computer.
            2. Open the downloaded file to install **24/7 SHOPPING**.
            3. Use this direct release link inside **Admin Control Room → Store & Security → GitHub Releases APK Download URL** so customers can download updates anytime.
          files: dist/247-shopping.apk
          draft: false
          prerelease: false
