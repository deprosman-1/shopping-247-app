name: Build Android APK & Publish Release

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build 24/7 SHOPPING APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare Android SDK & accept licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          mkdir -p "$SDK_DIR/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e" > "$SDK_DIR/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$SDK_DIR/licenses/android-sdk-preview-license"
          printf "\nd975f751698a77b662f1e54ddbeed3b01e93895a" > "$SDK_DIR/licenses/intel-android-extra-license"
          SDKMANAGER=$(command -v sdkmanager || find "$SDK_DIR" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses > /dev/null 2>&1 || true
          fi

      - name: Prepare debug keystore & env
        run: |
          if [ ! -s debug.keystore ] && [ -s debug.keystore.base64 ]; then
            tr -d '\r\n ' < debug.keystore.base64 | base64 -d > debug.keystore || rm -f debug.keystore
          fi
          if [ ! -s debug.keystore ] || ! keytool -list -keystore debug.keystore -storepass android -alias androiddebugkey >/dev/null 2>&1; then
            rm -f debug.keystore
            echo "Generating valid debug.keystore with keytool..."
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          keytool -list -keystore debug.keystore -storepass android
          if [ ! -f .env ]; then
            touch .env
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace -Dorg.gradle.workers.max=2 -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8"

      - name: Package APK for download
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/247-shopping.apk
          ls -lh dist/247-shopping.apk

      - name: Upload APK to Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 247-shopping-apk
          path: dist/247-shopping.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Releases
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v1.0-latest
          name: 24/7 SHOPPING — Latest Android APK
          body: |
            Automatically compiled Android APK for **24/7 SHOPPING**.

            ### How to download & install
            1. Click **`247-shopping.apk`** in **Assets** below to download to your phone or computer.
            2. Open the downloaded file to install **24/7 SHOPPING**.
            3. Use this direct release link inside **Admin Control Room → Store & Security → GitHub Releases APK Download URL** so customers can download updates anytime.
          files: dist/247-shopping.apk
          draft: false
          prerelease: false
